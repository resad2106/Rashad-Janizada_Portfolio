<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page Not Found | Rashad Janizada</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  .error-page{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:2rem; position:relative; overflow:hidden;
  }
  .error-code{
    font-family:var(--font-mono); font-size:clamp(4rem,14vw,8rem); font-weight:700;
    color:var(--blue); line-height:1; letter-spacing:-0.03em; margin:0;
  }
  .error-code::before{ content:'// '; color:var(--text-muted); font-size:0.4em; vertical-align:middle; }
  .error-title{ font-family:var(--font-display); font-size:1.5rem; margin:1rem 0 0.6rem; color:var(--text-primary); }
  .error-desc{ color:var(--text-secondary); max-width:44ch; margin:0 0 2rem; }
</style>
</head>
<body>
  <div class="scroll-progress" style="width:0"></div>
  <div class="error-page">
    <div class="hero-bg" aria-hidden="true">
      <div class="grid-lines"></div>
      <div class="glow glow-1"></div>
    </div>
    <p class="error-code" style="position:relative;z-index:1;">404</p>
    <h1 class="error-title" style="position:relative;z-index:1;">This route doesn't exist</h1>
    <p class="error-desc" style="position:relative;z-index:1;">The page you're looking for was moved, renamed, or never existed. Let's get you back on track.</p>
    <a href="/" class="btn btn-primary" style="position:relative;z-index:1;">Back to Home</a>
  </div>
</body>
</html>
